<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Colourly</title>

    <link
        rel="stylesheet"
        href="sidepanel.css"
    >

</head>

<body>

    <main class="container">

        <header>

            <div class="brand">

                <img
                    src="logo.png"
                    class="logo"
                    alt="Colourly"
                >

                <span>Colourly</span>

            </div>

            <p>
                Pick any colour from your screen.
            </p>

        </header>


        <section class="colour-card">

            <div
                id="colour-preview"
                class="colour-preview"
            ></div>

        </section>


        <section class="values-card">


            <div class="value-row">

                <div>

                    <span class="label">
                        HEX
                    </span>

                    <strong id="hex-value">
                        #FFFFFF
                    </strong>

                </div>

                <button
                    class="copy-button"
                    data-copy="hex-value"
                >
                    ⧉
                </button>

            </div>


            <div class="value-row">

                <div>

                    <span class="label">
                        RGB
                    </span>

                    <strong id="rgb-value">
                        255, 255, 255
                    </strong>

                </div>

                <button
                    class="copy-button"
                    data-copy="rgb-value"
                >
                    ⧉
                </button>

            </div>


            <div class="value-row">

                <div>

                    <span class="label">
                        HSL
                    </span>

                    <strong id="hsl-value">
                        0°, 0%, 100%
                    </strong>

                </div>

                <button
                    class="copy-button"
                    data-copy="hsl-value"
                >
                    ⧉
                </button>

            </div>


            <div class="value-row">

                <div>

                    <span class="label">
                        CMYK
                    </span>

                    <strong id="cmyk-value">
                        0%, 0%, 0%, 0%
                    </strong>

                </div>

                <button
                    class="copy-button"
                    data-copy="cmyk-value"
                >
                    ⧉
                </button>

            </div>


        </section>


        <footer>
            Colourly · Pick. Copy. Create.
        </footer>

    </main>


    <script src="sidepanel.js"></script>

</body>

</html>
